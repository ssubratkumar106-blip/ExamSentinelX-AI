{% extends "base.html" %}
{% block title %}Forgot Password — ExamSentinelX AI{% endblock %}

{% block extra_css %}
<style>
.auth-page { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card { width: 100%; max-width: 400px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg); }
.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.auth-logo p { font-size: 0.85rem; color: var(--text-3); }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Forgot Password</h1>
      <p>Enter your email to receive an OTP.</p>
    </div>
    <form method="POST" action="{{ url_for('password_bp.forgot_password') }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" style="margin-top:16px;">Send OTP</button>
    </form>
    <div style="text-align:center; margin-top:20px; font-size:0.875rem;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--text-3); text-decoration:none;">← Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
