{% extends "base.html" %}
{% block title %}Reset Password — ExamSentinelX AI{% endblock %}

{% block extra_css %}
<style>
.auth-page { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card { width: 100%; max-width: 400px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg); }
.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.auth-logo p { font-size: 0.85rem; color: var(--text-3); }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Set New Password</h1>
      <p>Please enter a strong new password.</p>
    </div>
    <form method="POST" action="{{ url_for('password_bp.reset_password', email=email, token=token) }}">
      <div class="form-group">
        <label for="password" class="form-label">New Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Min 8 characters" required>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Type it again" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" style="margin-top:16px;">Save Password</button>
    </form>
  </div>
</div>
{% endblock %}
